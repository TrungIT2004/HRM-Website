# NGINX Configuration for HRM System
# Rate limiting by IP - place this in /etc/nginx/sites-available/hrm or your nginx config directory
# Include in your main nginx.conf with: include /etc/nginx/sites-available/hrm;

# ============================================
# Rate Limit Zones (define once in http context)
# ============================================

# General API rate limit: 100 requests per second per IP, burst of 200
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# Stricter rate limit for auth endpoints: 10 requests per second per IP, burst of 20
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# Login endpoint rate limit: 5 requests per second per IP, burst of 10
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# Document upload/download rate limit: 20 requests per second per IP, burst of 50
limit_req_zone $binary_remote_addr zone=doc_limit:10m rate=20r/s;

# AI Chat rate limit: 30 requests per second per IP, burst of 50
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=30r/s;

# ============================================
# Upstream Backend (Spring Boot)
# ============================================
upstream hrm_backend {
    server localhost:8080;
    keepalive 32;
}

# Upstream AI Service (FastAPI)
upstream hrm_ai {
    server localhost:8000;
    keepalive 16;
}

# Upstream Frontend (Next.js)
upstream hrm_frontend {
    server localhost:3000;
    keepalive 32;
}

# ============================================
# Main Server Block
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name hrm-demo.duckdns.org workapp.com.vn;

    # Redirect HTTP to HTTPS (if using SSL)
    # return 301 https://$server_name$request_uri;

    # For development without SSL, serve directly:
    root /path/to/HRM/Website/public;  # Adjust to your Next.js build output

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json application/rss+xml image/svg+xml;

    # Client max body size for file uploads (adjust as needed)
    client_max_body_size 50M;

    # ============================================
    # Frontend (Next.js) - Static files & SSR
    # ============================================
    location / {
        # Rate limit for general page loads
        limit_req zone=api_limit burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ============================================
    # Backend API (Spring Boot) - /api/*
    # ============================================
    location /api/ {
        # General API rate limit
        limit_req zone=api_limit burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Pass through rate limit headers to client
        proxy_hide_header X-RateLimit-Limit;
        proxy_hide_header X-RateLimit-Remaining;
        proxy_hide_header Retry-After;
    }

    # ============================================
    # Stricter rate limits for specific endpoints
    # ============================================

    # Auth endpoints - stricter rate limiting
    location /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/auth/auto-login {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/auth/change-password {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Document upload/download - moderate rate limiting
    location /api/ai/documents/upload {
        limit_req zone=doc_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    location /api/ai/documents/ {
        # This covers download, preview, delete, chunks
        limit_req zone=doc_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Document templates (HRM Website /api/documents)
    location /api/documents {
        limit_req zone=doc_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # AI Chat endpoints - moderate rate limiting for streaming
    location /api/ai/chat {
        limit_req zone=ai_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;  # Important for SSE streaming
        proxy_cache off;
    }

    location /api/ai/chat/stream {
        limit_req zone=ai_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;  # Critical for SSE
        proxy_cache off;
    }

    # AI Conversations
    location /api/ai/conversations {
        limit_req zone=ai_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Attendance check-in (camera) - no auth, but rate limit to prevent abuse
    location /api/attendances/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/overtime/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ============================================
    # Static file serving (uploads, assets)
    # ============================================
    location /uploads/ {
        alias /path/to/backend/uploads/;  # Adjust to your actual uploads directory
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # Health check endpoint (no rate limit)
    # ============================================
    location /actuator/health {
        access_log off;
        proxy_pass http://hrm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Custom 429 error page
    # ============================================
    error_page 429 /429.html;
    location = /429.html {
        internal;
        return 429 '{"errorCode":"RATE_LIMIT_EXCEEDED","msg":"Quá nhiều yêu cầu từ IP này. Vui lòng thử lại sau."}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }
}

