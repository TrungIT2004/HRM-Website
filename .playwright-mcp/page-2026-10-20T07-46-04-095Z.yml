  - paragraph [ref=f3e3]: Sequence / Security · Diagram Design
  - heading "Auth Token Lifecycle — Expiry, Recovery, Revocation" [level=1] [ref=f3e4]
  - img "Authentication token lifecycle sequence Login returns a 15 minute access token and a 7 day HttpOnly refresh cookie. Requests carry the access token and are checked against a Redis blacklist. On 401 the api client performs a single-flight auto-login using the refresh cookie; the server validates the session, rotates both tokens, and queued requests replay. Logout revokes the session in PostgreSQL and blacklists the session id in Redis." [ref=f3e6]:
