<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRM — Auth Token Lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --color-soft:   #8b95a8;
      --color-rule:   #d0d5dd;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1440px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1440px; display: block; }
    svg text { font-family: var(--font-sans); }
    .mono { font-family: var(--font-mono); }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence / Security · Diagram Design</p>
    <h1>Auth Token Lifecycle — Expiry, Recovery, Revocation</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1440 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-title auth-desc">
        <title id="auth-title">Authentication token lifecycle sequence</title>
        <desc id="auth-desc">Login returns a 15 minute access token and a 7 day HttpOnly refresh cookie. Requests carry the access token and are checked against a Redis blacklist. On 401 the api client performs a single-flight auto-login; the server validates the session, rotates both tokens, and queued requests replay. Logout revokes the session in PostgreSQL and blacklists the session id in Redis.</desc>
        <defs>
          <marker id="msg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#2d3142"/>
          </marker>
          <marker id="msg-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#6b778c"/>
          </marker>
          <marker id="msg-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0 0, 10 4, 0 8" fill="#bf4520"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============================================================
             LIFELINES
             ============================================================ -->
        <line x1="150" y1="152" x2="150" y2="1108" stroke="#c9cfd9" stroke-width="1.2" stroke-dasharray="3 4"/>
        <line x1="400" y1="152" x2="400" y2="1108" stroke="#c9cfd9" stroke-width="1.2" stroke-dasharray="3 4"/>
        <line x1="700" y1="152" x2="700" y2="1108" stroke="#c9cfd9" stroke-width="1.2" stroke-dasharray="3 4"/>
        <line x1="1000" y1="152" x2="1000" y2="1108" stroke="#c9cfd9" stroke-width="1.2" stroke-dasharray="3 4"/>
        <line x1="1280" y1="152" x2="1280" y2="1108" stroke="#c9cfd9" stroke-width="1.2" stroke-dasharray="3 4"/>

        <!-- activation bars -->
        <rect x="395" y="590" width="10" height="294" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>
        <rect x="695" y="176" width="10" height="932" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>
        <rect x="985" y="218" width="10" height="32" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>
        <rect x="985" y="736" width="10" height="26" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>
        <rect x="985" y="1016" width="10" height="24" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>
        <rect x="1265" y="380" width="10" height="32" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>
        <rect x="1265" y="784" width="10" height="24" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>
        <rect x="1265" y="1058" width="10" height="24" fill="#e9ecf1" stroke="#c9cfd9" stroke-width="0.8"/>

        <!-- ============================================================
             PARTICIPANTS
             ============================================================ -->
        <rect x="75" y="100" width="150" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
        <text x="150" y="125" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#2d3142" text-anchor="middle">BROWSER</text>
        <text x="150" y="141" class="mono" font-size="8" fill="#6b778c" text-anchor="middle">Next.js client</text>

        <rect x="325" y="100" width="150" height="52" rx="6" fill="#ffffff" stroke="#8b95a8" stroke-width="1.2" stroke-dasharray="5 4"/>
        <text x="400" y="125" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#4f5d75" text-anchor="middle">API CLIENT</text>
        <text x="400" y="141" class="mono" font-size="8" fill="#6b778c" text-anchor="middle">apiClient.ts</text>

        <rect x="625" y="100" width="150" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
        <text x="700" y="125" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#2d3142" text-anchor="middle">SPRING BOOT</text>
        <text x="700" y="141" class="mono" font-size="8" fill="#6b778c" text-anchor="middle">AuthService</text>

        <rect x="925" y="100" width="150" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
        <text x="1000" y="125" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#2d3142" text-anchor="middle">POSTGRESQL</text>
        <text x="1000" y="141" class="mono" font-size="8" fill="#6b778c" text-anchor="middle">user_sessions</text>

        <rect x="1205" y="100" width="150" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
        <text x="1280" y="125" class="mono" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#2d3142" text-anchor="middle">REDIS</text>
        <text x="1280" y="141" class="mono" font-size="8" fill="#6b778c" text-anchor="middle">session blacklist</text>

        <!-- ============================================================
             STEP NUMBERS
             ============================================================ -->
        <g class="mono" font-size="9" font-weight="600" fill="#4f5d75" text-anchor="middle">
          <circle cx="64" cy="196" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="199.5">1</text>
          <circle cx="64" cy="234" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="237.5">2</text>
          <circle cx="64" cy="292" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="295.5">3</text>
          <circle cx="64" cy="358" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="361.5">4</text>
          <circle cx="64" cy="396" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="399.5">5</text>
          <circle cx="64" cy="448" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="451.5">6</text>
          <circle cx="64" cy="576" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="579.5">7</text>
          <circle cx="64" cy="614" r="9" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/><text x="64" y="617.5" fill="#bf4520">8</text>
          <circle cx="64" cy="659" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="662.5">9</text>
          <circle cx="64" cy="706" r="9" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/><text x="64" y="709.5" fill="#bf4520">10</text>
          <circle cx="64" cy="748" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="751.5">11</text>
          <circle cx="64" cy="790" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="793.5">12</text>
          <circle cx="64" cy="836" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="839.5">13</text>
          <circle cx="64" cy="872" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="875.5">14</text>
          <circle cx="64" cy="982" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="985.5">15</text>
          <circle cx="64" cy="1024" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="1027.5">16</text>
          <circle cx="64" cy="1066" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="1069.5">17</text>
          <circle cx="64" cy="1096" r="9" fill="#ffffff" stroke="#c9cfd9" stroke-width="1"/><text x="64" y="1099.5">18</text>
        </g>

        <!-- ============================================================
             LOGIN
             ============================================================ -->
        <line x1="150" y1="196" x2="692" y2="196" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="160" y="188" class="mono" font-size="10" fill="#2d3142">POST /auth/login · { email, password }</text>

        <line x1="700" y1="234" x2="992" y2="234" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="710" y="226" class="mono" font-size="10" fill="#2d3142">verify BCrypt · INSERT user_sessions</text>

        <line x1="700" y1="292" x2="158" y2="292" stroke="#6b778c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#msg-soft)"/>
        <text x="690" y="284" class="mono" font-size="10" fill="#4f5d75" text-anchor="end">200 · accessToken (15 min)</text>
        <text x="690" y="312" class="mono" font-size="10" fill="#6b778c" text-anchor="end">Set-Cookie: refreshToken (7 d)</text>

        <!-- ============================================================
             AUTHENTICATED REQUEST
             ============================================================ -->
        <text x="60" y="328" class="mono" font-size="9" letter-spacing="0.16em" fill="#4f5d75">AUTHENTICATED REQUEST</text>
        <line x1="258" y1="336" x2="1380" y2="336" stroke="#c9cfd9" stroke-width="1" stroke-dasharray="3 4"/>

        <line x1="150" y1="358" x2="692" y2="358" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="160" y="350" class="mono" font-size="10" fill="#2d3142">GET /api/payrolls · Bearer &lt;access&gt;</text>

        <line x1="700" y1="396" x2="1262" y2="396" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="710" y="388" class="mono" font-size="10" fill="#2d3142">GET blacklist:&lt;sessionId&gt; → absent</text>

        <line x1="700" y1="448" x2="158" y2="448" stroke="#6b778c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#msg-soft)"/>
        <text x="690" y="440" class="mono" font-size="10" fill="#4f5d75" text-anchor="end">200 OK</text>

        <!-- ============================================================
             EXPIRY & RECOVERY
             ============================================================ -->
        <text x="60" y="520" class="mono" font-size="9" letter-spacing="0.16em" fill="#4f5d75">TOKEN EXPIRY &amp; RECOVERY</text>
        <line x1="258" y1="528" x2="1380" y2="528" stroke="#c9cfd9" stroke-width="1" stroke-dasharray="3 4"/>

        <line x1="150" y1="576" x2="692" y2="576" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="160" y="568" class="mono" font-size="10" fill="#2d3142">GET /api/leave · token expired</text>

        <line x1="700" y1="614" x2="158" y2="614" stroke="#bf4520" stroke-width="1.6" marker-end="url(#msg-accent)"/>
        <text x="690" y="606" class="mono" font-size="10" font-weight="500" fill="#bf4520" text-anchor="end">401 Unauthorized</text>

        <path d="M 400,644 H 470 Q 478,644 478,652 V 666 Q 478,674 470,674 H 404" fill="none" stroke="#6b778c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#msg-soft)"/>
        <text x="490" y="662" class="mono" font-size="10" fill="#4f5d75">single-flight · isRefreshing</text>

        <line x1="400" y1="706" x2="692" y2="706" stroke="#bf4520" stroke-width="1.6" marker-end="url(#msg-accent)"/>
        <text x="410" y="698" class="mono" font-size="10" font-weight="500" fill="#bf4520">POST /auth/auto-login · refresh cookie</text>

        <line x1="700" y1="748" x2="992" y2="748" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="710" y="740" class="mono" font-size="10" fill="#2d3142">load session · deviceId · revoked · hash</text>

        <line x1="700" y1="790" x2="1262" y2="790" stroke="#6b778c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#msg-soft)"/>
        <text x="710" y="782" class="mono" font-size="10" fill="#6b778c">if invalid → SET blacklist (15 min)</text>

        <line x1="700" y1="836" x2="408" y2="836" stroke="#6b778c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#msg-soft)"/>
        <text x="690" y="828" class="mono" font-size="10" fill="#4f5d75" text-anchor="end">200 · new accessToken · rotated cookie</text>

        <line x1="400" y1="872" x2="692" y2="872" stroke="#6b778c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#msg-soft)"/>
        <text x="410" y="864" class="mono" font-size="10" fill="#6b778c">replay queued requests</text>

        <!-- ============================================================
             LOGOUT
             ============================================================ -->
        <text x="60" y="926" class="mono" font-size="9" letter-spacing="0.16em" fill="#4f5d75">LOGOUT &amp; REVOCATION</text>
        <line x1="258" y1="934" x2="1380" y2="934" stroke="#c9cfd9" stroke-width="1" stroke-dasharray="3 4"/>

        <line x1="150" y1="982" x2="692" y2="982" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="160" y="974" class="mono" font-size="10" fill="#2d3142">POST /auth/logout</text>

        <line x1="700" y1="1024" x2="992" y2="1024" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="710" y="1016" class="mono" font-size="10" fill="#2d3142">revoke user_session</text>

        <line x1="700" y1="1066" x2="1262" y2="1066" stroke="#2d3142" stroke-width="1.5" marker-end="url(#msg)"/>
        <text x="710" y="1058" class="mono" font-size="10" fill="#2d3142">SET blacklist:&lt;sessionId&gt; · 15 min</text>

        <line x1="700" y1="1096" x2="158" y2="1096" stroke="#6b778c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#msg-soft)"/>
        <text x="690" y="1088" class="mono" font-size="10" fill="#4f5d75" text-anchor="end">200 · cookie cleared</text>

        <!-- ============================================================
             NOTES
             ============================================================ -->
        <line x1="60" y1="1124" x2="1380" y2="1124" stroke="#c9cfd9" stroke-width="1"/>
        <text x="60" y="1144" class="mono" font-size="9" fill="#4f5d75">FAILURE PATHS · SESSION_NOT_FOUND · SESSION_REVOKED · SESSION_MISMATCH (deviceId) · SESSION_COMPROMISED (hash mismatch → revoke + blacklist)</text>
        <text x="60" y="1162" class="mono" font-size="9" fill="#6b778c">TOKENS · access 15 min · refresh 7 d · rotation on every auto-login · blacklist TTL 15 min · concurrent 401s collapse into one refresh</text>
      </svg>
    </div>
  </div>
</body>
</html>
