<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRM System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --color-soft:    #8b95a8;
      --color-rule:    #d0d5dd;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1400px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>HRM Platform — System Architecture</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hrm-arch-title hrm-arch-desc">
        <title id="hrm-arch-title">HRM Platform System Architecture</title>
        <desc id="hrm-arch-desc">Enterprise HRM platform with Next.js frontend, Spring Boot backend, FastAPI AI service, biometric attendance edge module, PostgreSQL with pgvector, Redis cache, and n8n workflow automation.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b95a8"/></marker>

          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>

          <!-- Gradients for zone fills -->
          <linearGradient id="zone-frontend" x1="0%" y1="0%" x2="0%" y2="100%">

            <stop offset="100%" stop-color="#2d3142" stop-opacity="0.04"/>
          </linearGradient>
          <linearGradient id="zone-backend" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2d3142" stop-opacity="0.02"/>
            <stop offset="100%" stop-color="#2d3142" stop-opacity="0.04"/>
          </linearGradient>
          <linearGradient id="zone-ai" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#bf4520" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#bf4520" stop-opacity="0.06"/>
          </linearGradient>
          <linearGradient id="zone-data" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2d3142" stop-opacity="0.02"/>
            <stop offset="100%" stop-color="#2d3142" stop-opacity="0.04"/>
          </linearGradient>
          <linearGradient id="zone-edge" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4f5d75" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#4f5d75" stop-opacity="0.06"/>
          </linearGradient>

            <stop offset="0%" stop-color="#8b95a8" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#8b95a8" stop-opacity="0.06"/>

        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="60" y="64" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="108" y="73" fill="#8b95a8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">FRONTEND</text>

        <text x="120" y="691" fill="#8b95a8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">EDGE BIOMETRICS</text>

        <!-- Ops/Infra Zone -->
