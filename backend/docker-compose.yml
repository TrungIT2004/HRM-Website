version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: social-db
    environment:
      POSTGRES_DB: social_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '@Minhtrung1408'   # Đặt trong dấu nháy đơn để an toàn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: hrm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/social_app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: '@Minhtrung1408'
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: