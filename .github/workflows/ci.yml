name: CI - Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Kiểm tra và chạy unit/integration test cho Backend
  # -------------------------------------------------------------
  backend-test:
    name: Backend (Spring Boot & Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: social_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Prepare application.properties for CI
        working-directory: backend
        run: |
          cp src/main/resources/application.properties.example src/main/resources/application.properties
          sed -i 's/YOUR_POSTGRESQL_PASSWORD/password123/g' src/main/resources/application.properties
          mkdir -p logs uploads

      - name: Run Backend Tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/social_app
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password123
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: ./mvnw clean test

  # -------------------------------------------------------------
  # Job 2: Kiểm tra biên dịch và typecheck cho HRM Website (Next.js)
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend (Next.js & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'HRM Website/package-lock.json'

      - name: Install dependencies
        working-directory: "HRM Website"
        run: npm ci

      - name: Build Next.js
        working-directory: "HRM Website"
        run: npm run build
